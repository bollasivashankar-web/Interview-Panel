[project]
name = "interviewos-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.34.0",
  "SQLAlchemy==2.0.52",
  "alembic==1.14.0",
  "psycopg[binary]==3.3.2",
  "PyJWT==2.15.1",
  "pydantic-settings==2.7.0",
  "email-validator==2.2.0",
  "pytest==9.1.1",
  "httpx==0.28.1",
  "redis==6.4.0",
  "pypdf==6.20.1",
  "python-multipart==0.0.32"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"


[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "python -m alembic upgrade head"
